title: "Everything That Moves And Thinks"
description: "I'm a robotics engineer exploring the intersection of large language models and physical manipulation."
# User site (sheilsarda.github.io) is the domain root. Posts are /blog/:title/.
# Do not enable Pages on the sheilsarda/blog project repo; that path would override these posts.
baseurl: ""
url: "https://sheilsarda.github.io"
permalink: "/blog/:title/"
future: true

exclude:
  - README.md

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
